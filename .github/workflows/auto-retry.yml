# 失败自动重跑（最多一次）：重跑会分配新 runner，即新出口 IP，
# 绕开被夸克 CDN 静默丢包的 IP 段（症状：预检与 Gopeed 均 curl 28 / HTTP 000）。
# rerun-failed-jobs 只能在 run 进入终态后调用，主 workflow 自己跑着时永远
# 不终态，所以必须用独立 workflow 由 workflow_run 触发，不能塞进主文件。
name: auto-retry

on:
  workflow_run:
    workflows: ["Download and upload to tgstate"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-once:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    steps:
      - name: 换 runner 重跑失败任务
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 15
          gh api -X POST \
            "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs" \
            > /dev/null
          echo "已触发 attempt 2 重跑（新 runner = 新出口 IP）"
