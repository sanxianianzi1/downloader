# 自动清理历史 workflow runs。
# 手动触发（workflow_dispatch）可自定义保留天数：填 0 = 删除全部历史；
# 定时触发每天删除 KEEP_DAYS_DAYS（默认 7）之前的所有 runs。
name: cleanup-runs

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      keep_days:
        description: 保留最近几天的 runs（0 = 全删）
        default: "0"

permissions:
  actions: write

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    steps:
      - name: 删除过期 workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days || '7' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${KEEP_DAYS} days" '+%Y-%m-%dT%H:%M:%SZ')
          # 排除本 run：running 状态的 run 删不掉，不排除会让查询结果永不空、
          # 配合吞错误的 || true 变成死循环（实测跑 19 分钟被手动取消）
          self="${{ github.run_id }}"
          echo "删除 ${cutoff} 之前创建的 runs（排除本 run ${self}）"
          total=0
          for round in 1 2 3; do
            ids=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&created=<${cutoff}" \
              --paginate --jq ".workflow_runs[] | select(.id != ${self}) | .id" 2>/dev/null || true)
            [ -z "$ids" ] && break
            n=$(echo "$ids" | wc -l)
            echo "第 ${round} 轮：待删 ${n} 个"
            echo "$ids" | xargs -P 8 -I{} gh api -X DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/{}" > /dev/null 2>&1 || true
            total=$((total + n))
          done
          left=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=1&created=<${cutoff}" \
            --jq '.total_count' 2>/dev/null || echo '?')
          echo "已删除 ${total} 个，剩余 ${left} 个（进行中的 run 会保留，属正常）"
